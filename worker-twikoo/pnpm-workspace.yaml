# 让 worker-twikoo/ 成为一个独立的 pnpm 项目。
#
# 根目录的 pnpm-workspace.yaml 没有 `packages:` 字段，所以不写这个文件的话，
# 在 worker-twikoo/ 里跑 `pnpm install` 会被 pnpm 一路向上当成「在根工作区里安装」——
# 结果是根依赖被重装一遍（Nuxt 那一堆），wrangler 反而没装上。
#
# 有了它，worker-twikoo/ 就是自己的 workspace root，依赖互不干扰，也不需要 --ignore-workspace。
packages:
  - '.'

# pnpm 10+ 默认拦截依赖的构建脚本。这两个必须放行，否则 wrangler 起不来：
#   workerd  —— wrangler dev 的运行时本体，二进制靠 postinstall 落地
#   esbuild  —— 打包 Worker 用
allowBuilds:
  esbuild: true
  workerd: true
